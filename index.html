<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Room Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- DragControls for Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; touch-action: none; font-family: 'Inter', sans-serif; }
        #canvas-container canvas { display: block; outline: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen w-screen flex flex-col overflow-hidden">

    <!-- Toast Notification System -->
    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 bg-white z-40 flex flex-col items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 text-center border border-gray-100">
            <div class="mb-6 flex justify-center">
                <svg class="w-16 h-16 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </div>
            <h1 class="text-3xl font-bold mb-2 text-gray-800">3D Room Planner</h1>
            <p class="text-gray-500 mb-8 text-sm">部屋の大きさを設定して、家具を自由に配置しましょう。データはクラウドに保存されます。</p>
            
            <button id="btn-google-login" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-xl shadow-sm hover:bg-gray-50 active:bg-gray-100 transition duration-200 mb-4">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Googleでログイン
            </button>
            <button id="btn-guest-login" class="w-full text-gray-500 font-medium py-2 hover:text-gray-700 transition duration-200">
                お試しで始める（ゲスト）
            </button>
        </div>
    </div>

    <!-- Main App UI -->
    <div id="main-app" class="flex-1 flex flex-row hidden w-full h-full relative overflow-hidden">
        <!-- 3D Canvas Area -->
        <div id="canvas-container" class="flex-1 relative bg-gray-200 shadow-inner w-full h-full cursor-pointer">
            <div class="absolute top-4 left-4 right-4 flex justify-between pointer-events-none z-10">
                <div class="bg-white/90 backdrop-blur-sm px-4 py-2 rounded-xl text-sm font-bold shadow-md pointer-events-auto text-gray-700">
                    <span id="ui-username">...</span>
                </div>
                <button id="btn-logout" class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-red-100 pointer-events-auto transition">
                    ログアウト
                </button>
            </div>
            
            <!-- View Mode Toggle -->
            <div class="absolute top-16 left-4 z-10 pointer-events-auto flex flex-col gap-2">
                <div class="bg-white rounded-xl shadow-md p-1 flex gap-1 border border-gray-200">
                    <button id="btn-view-3d" class="px-3 py-1.5 text-sm font-bold rounded-lg bg-blue-100 text-blue-700 transition">3D斜め</button>
                    <button id="btn-view-2d" class="px-3 py-1.5 text-sm font-bold rounded-lg text-gray-500 hover:bg-gray-50 transition">2D真上</button>
                </div>
                <div class="bg-white rounded-xl shadow-md p-1 flex border border-gray-200 w-max">
                    <button id="btn-toggle-grid" class="px-3 py-1.5 text-sm font-bold rounded-lg bg-blue-100 text-blue-700 transition w-full shadow-sm">マス目 ON</button>
                </div>
            </div>

            <!-- Mobile Panel Toggle Button -->
            <button id="btn-toggle-panel" class="md:hidden absolute bottom-6 right-4 bg-blue-600 text-white px-5 py-3 rounded-full shadow-lg font-bold text-sm z-20 pointer-events-auto flex items-center gap-2 hover:bg-blue-700 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                家具・設定
            </button>
        </div>

        <!-- Controls Panel -->
        <div id="controls-panel" class="absolute md:relative bottom-0 left-0 w-full md:w-96 lg:w-[420px] bg-gray-50 md:border-l border-gray-200 shadow-[0_-10px_40px_rgba(0,0,0,0.15)] md:shadow-2xl z-30 flex flex-col h-[75vh] md:h-full transition-transform duration-300 translate-y-0 md:translate-y-0 rounded-t-3xl md:rounded-none">
            <!-- Mobile Close Handle -->
            <div id="btn-close-panel" class="md:hidden w-full h-8 flex items-center justify-center cursor-pointer pt-2 pb-1 active:bg-gray-100 rounded-t-3xl">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
            </div>

            <div class="px-5 pb-5 pt-2 md:pt-5 bg-white border-b border-gray-200 flex-shrink-0 shadow-sm z-10">
                <h2 class="text-xl font-extrabold text-gray-800 flex items-center gap-2">
                    <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    部屋 & 家具の設定
                </h2>
            </div>
            
            <div class="flex-1 overflow-y-auto p-5 space-y-6 hide-scrollbar">
                <!-- Room Size Settings -->
                <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm">
                    <h3 class="text-base font-bold text-gray-800 mb-4 flex justify-between items-center">
                        <span>部屋の形とサイズ</span>
                        <span id="room-tatami-display" class="bg-blue-100 text-blue-800 text-sm font-extrabold px-3 py-1 rounded-lg">約 -- 畳</span>
                    </h3>
                    
                    <!-- Tabs -->
                    <div class="flex gap-2 mb-5">
                        <button id="tab-rect" class="flex-1 text-sm font-bold text-blue-600 border-b-2 border-blue-600 pb-2 transition-all">四角形</button>
                        <button id="tab-custom" class="flex-1 text-sm font-medium text-gray-400 border-b-2 border-transparent pb-2 hover:text-gray-600 transition-all">自由な形</button>
                    </div>

                    <!-- Rect Panel -->
                    <div id="panel-rect" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1.5">広さの目安から選ぶ</label>
                            <select id="room-preset" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 text-sm font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
                                <option value="">（カスタムサイズ）</option>
                                <option value="4.5">4.5畳 (273cm × 273cm)</option>
                                <option value="6" selected>6畳 (273cm × 364cm)</option>
                                <option value="8">8畳 (364cm × 364cm)</option>
                                <option value="10">10畳 (364cm × 455cm)</option>
                                <option value="12">12畳 (364cm × 546cm)</option>
                            </select>
                        </div>

                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="block text-sm font-medium text-gray-600 mb-1.5">幅 (X軸・cm)</label>
                                <input type="number" id="room-width" value="273" step="1" min="100" max="2000" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
                            </div>
                            <div class="flex-1">
                                <label class="block text-sm font-medium text-gray-600 mb-1.5">奥行き (Z軸・cm)</label>
                                <input type="number" id="room-depth" value="364" step="1" min="100" max="2000" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
                            </div>
                        </div>
                    </div>

                    <!-- Custom Shape Panel -->
                    <div id="panel-custom" class="hidden space-y-4">
                        <div class="bg-blue-50 text-blue-800 text-xs p-3 rounded-xl border border-blue-200">
                            💡 下の図の <strong>青い丸（1, 2, 3...）を指でドラッグ</strong> すると、部屋の形を自由に変更できます。
                        </div>
                        
                        <!-- SVG Map Editor -->
                        <div id="shape-editor-container" class="w-full h-56 bg-white border border-gray-300 rounded-xl relative overflow-hidden touch-none shadow-inner">
                            <svg id="shape-editor-svg" viewBox="-6 -6 12 12" class="w-full h-full touch-none" preserveAspectRatio="xMidYMid meet">
                                <defs>
                                    <pattern id="grid" width="1" height="1" patternUnits="userSpaceOnUse">
                                        <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#e5e7eb" stroke-width="0.05"/>
                                    </pattern>
                                    <pattern id="grid-center" width="12" height="12" patternUnits="userSpaceOnUse">
                                        <path d="M 6 0 L 6 12 M 0 6 L 12 6" fill="none" stroke="#9ca3af" stroke-width="0.08"/>
                                    </pattern>
                                </defs>
                                <rect x="-6" y="-6" width="12" height="12" fill="url(#grid)" />
                                <rect x="-6" y="-6" width="12" height="12" fill="url(#grid-center)" />
                                <polygon id="shape-polygon" points="" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="0.1" stroke-linejoin="round"/>
                                <g id="shape-circles"></g>
                            </svg>
                        </div>
                        
                        <!-- Presets -->
                        <div class="grid grid-cols-3 gap-2">
                            <button id="btn-preset-l" class="bg-white border border-gray-300 text-gray-700 rounded-xl py-2 text-xs font-bold hover:bg-gray-50 shadow-sm transition">L字型</button>
                            <button id="btn-preset-u" class="bg-white border border-gray-300 text-gray-700 rounded-xl py-2 text-xs font-bold hover:bg-gray-50 shadow-sm transition">コの字型</button>
                            <button id="btn-preset-t" class="bg-white border border-gray-300 text-gray-700 rounded-xl py-2 text-xs font-bold hover:bg-gray-50 shadow-sm transition">T字型</button>
                        </div>

                        <!-- Manual Coordinate Editor -->
                        <details class="bg-gray-50 border border-gray-200 rounded-xl shadow-sm">
                            <summary class="px-4 py-3 text-sm font-bold text-gray-700 cursor-pointer outline-none hover:bg-gray-100 transition rounded-xl">
                                ＋ 数値で微調整（高度な設定）
                            </summary>
                            <div class="p-3 border-t border-gray-200">
                                <label class="block text-xs font-medium text-gray-500 mb-2">頂点座標 (cm) - ぐるっと一周する順番で</label>
                                <div id="vertex-container" class="space-y-2.5 max-h-40 overflow-y-auto p-1">
                                    <!-- 頂点入力が動的に入る -->
                                </div>
                                <button id="btn-add-vertex" class="mt-3 w-full bg-white border border-gray-300 text-gray-700 rounded-lg py-2.5 text-sm font-bold hover:bg-gray-50 shadow-sm transition">+ 頂点追加</button>
                            </div>
                        </details>
                    </div>

                    <button id="btn-update-room" class="mt-5 w-full bg-gray-800 text-white rounded-xl py-3 text-sm font-bold shadow-md hover:bg-gray-700 transition">
                        部屋の形を更新
                    </button>
                </div>

                <!-- Add Furniture -->
                <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm">
                    <h3 class="text-base font-bold text-gray-800 mb-4 border-b border-gray-100 pb-3">家具を追加</h3>
                    
                    <div class="mb-5">
                        <label class="block text-sm font-medium text-gray-600 mb-2">よく使う家具（ワンタップ追加）</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button class="btn-quick-add flex justify-center items-center gap-1 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 py-2.5 rounded-xl text-sm font-bold border border-indigo-200 shadow-sm" data-name="ベッド" data-w="100" data-h="50" data-d="200" data-color="#4F46E5">🛏️ ベッド</button>
                            <button class="btn-quick-add flex justify-center items-center gap-1 bg-amber-50 text-amber-700 hover:bg-amber-100 py-2.5 rounded-xl text-sm font-bold border border-amber-200 shadow-sm" data-name="デスク" data-w="120" data-h="70" data-d="60" data-color="#D97706">💻 デスク</button>
                            <button class="btn-quick-add flex justify-center items-center gap-1 bg-gray-50 text-gray-700 hover:bg-gray-100 py-2.5 rounded-xl text-sm font-bold border border-gray-200 shadow-sm" data-name="チェア" data-w="50" data-h="90" data-d="50" data-color="#4B5563">🪑 チェア</button>
                            <button class="btn-quick-add flex justify-center items-center gap-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 py-2.5 rounded-xl text-sm font-bold border border-emerald-200 shadow-sm" data-name="ソファ" data-w="160" data-h="70" data-d="80" data-color="#10B981">🛋️ ソファ</button>
                        </div>
                    </div>

                    <div class="border-t border-gray-100 pt-4">
                        <label class="block text-sm font-medium text-gray-600 mb-3">サイズを細かく指定して追加 (cm単位)</label>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-600 mb-1.5">種類 / 名前</label>
                                <input type="text" id="furn-name" placeholder="例：テレビ台" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div class="flex gap-2">
                                <div class="flex-1">
                                    <label class="block text-sm font-medium text-gray-600 mb-1.5">幅(W)</label>
                                    <input type="number" id="furn-w" value="100" step="5" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div class="flex-1">
                                    <label class="block text-sm font-medium text-gray-600 mb-1.5">高さ(H)</label>
                                    <input type="number" id="furn-h" value="50" step="5" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div class="flex-1">
                                    <label class="block text-sm font-medium text-gray-600 mb-1.5">奥行(D)</label>
                                    <input type="number" id="furn-d" value="40" step="5" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-600 mb-1.5">色</label>
                                <input type="color" id="furn-color" value="#4F46E5" class="w-full h-12 rounded-xl cursor-pointer border border-gray-300 p-1 bg-gray-50">
                            </div>
                            <button id="btn-add-furn" class="w-full bg-blue-600 text-white rounded-xl py-3 text-sm font-bold shadow-md hover:bg-blue-700 transition flex items-center justify-center gap-2 mt-2">
                                家具を追加する
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Selected Item Controls (Hidden by default) -->
                <div id="selected-controls" class="bg-blue-50 border-2 border-blue-200 rounded-2xl p-5 shadow-sm hidden">
                    <div class="flex items-center gap-2 mb-3">
                        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                        <h3 class="text-sm font-extrabold text-blue-800">選択中の家具</h3>
                    </div>
                    <p id="sel-furn-name" class="text-base text-gray-800 mb-4 font-bold bg-white px-3 py-2 rounded-lg border border-blue-100">---</p>
                    <div class="flex gap-3">
                        <button id="btn-rot-furn" class="flex-1 bg-white border border-blue-300 text-blue-700 rounded-xl py-2.5 text-sm font-bold shadow-sm hover:bg-blue-50 transition">
                            90度回転
                        </button>
                        <button id="btn-del-furn" class="flex-1 bg-red-50 border border-red-200 text-red-600 rounded-xl py-2.5 text-sm font-bold shadow-sm hover:bg-red-100 transition">
                            削除
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase System -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signInAnonymously, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 1. Firebase Configの定義
        const firebaseConfig = {
            apiKey: "AIzaSyD70dhKVFF7nz1J-1w4XuTovMKzZYSdhlc",
            authDomain: "syokuno.firebaseapp.com",
            projectId: "syokuno",
            storageBucket: "syokuno.firebasestorage.app",
            messagingSenderId: "1018341800237",
            appId: "1:1018341800237:web:19900243c0859a44713ba4"
        };

        // 2. 初期化
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 3. appId を定義（Firestoreパス参照用）
        const appId = "3d-room-planner-app";

        let currentUserId = null;
        let unsubscribeRoom = null;
        let unsubscribeItems = null;

        // --- State Management ---
        const state = {
            room: { type: 'rect', width: 2.73, depth: 3.64, vertices: [] },
            items: []
        };
        let uiRoomType = 'rect';

        // --- Firestore References ---
        function getRoomDocRef() {
            return doc(db, 'artifacts', appId, 'users', currentUserId, 'settings', 'room');
        }
        function getItemsCollectionRef() {
            return collection(db, 'artifacts', appId, 'users', currentUserId, 'furniture');
        }
        function getItemDocRef(itemId) {
            return doc(db, 'artifacts', appId, 'users', currentUserId, 'furniture', itemId);
        }

        // --- UI Toast ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bg = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-green-500' : 'bg-blue-500';
            toast.className = `${bg} text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium transition-all duration-300`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // --- Auth Logic ---
        const loginScreen = document.getElementById('login-screen');
        const mainApp = document.getElementById('main-app');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                document.getElementById('ui-username').innerText = user.isAnonymous ? "ゲスト" : (user.displayName || "ユーザー");
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                initDataListeners();
                initThreeJS();
            } else {
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
                if(unsubscribeRoom) unsubscribeRoom();
                if(unsubscribeItems) unsubscribeItems();
            }
        });

        document.getElementById('btn-google-login').addEventListener('click', () => signInWithPopup(auth, new GoogleAuthProvider()));
        document.getElementById('btn-guest-login').addEventListener('click', () => signInAnonymously(auth));
        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        // --- Data Listeners ---
        function initDataListeners() {
            unsubscribeRoom = onSnapshot(getRoomDocRef(), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    state.room = { type: data.type || 'rect', width: data.width || 2.73, depth: data.depth || 3.64, vertices: data.vertices || [] };
                    
                    if (state.room.type === 'rect') {
                        document.getElementById('room-width').value = Math.round(state.room.width * 100);
                        document.getElementById('room-depth').value = Math.round(state.room.depth * 100);
                        switchRoomType('rect');
                    } else {
                        renderVertexUI(state.room.vertices);
                        switchRoomType('custom');
                    }
                    onRoomShapeModified();
                    updateRoomVisuals();
                } else {
                    setDoc(getRoomDocRef(), state.room);
                }
            });

            unsubscribeItems = onSnapshot(getItemsCollectionRef(), (snapshot) => {
                state.items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                syncVisualsWithState();
            });
        }

        // --- Mobile Panel Toggle ---
        const controlsPanel = document.getElementById('controls-panel');
        let isPanelOpen = window.innerWidth >= 768;
        function setPanelState(open) {
            isPanelOpen = open;
            if (open) controlsPanel.classList.remove('translate-y-full');
            else controlsPanel.classList.add('translate-y-full');
        }
        document.getElementById('btn-toggle-panel').addEventListener('click', () => setPanelState(true));
        document.getElementById('btn-close-panel').addEventListener('click', () => setPanelState(false));

        // --- Room Geometry Logic (cm <-> m conversion) ---
        function onRoomShapeModified() {
            let area = 0;
            if (uiRoomType === 'rect') {
                const w = (parseFloat(document.getElementById('room-width').value) || 0) / 100;
                const d = (parseFloat(document.getElementById('room-depth').value) || 0) / 100;
                area = w * d;
            } else {
                const verts = getVerticesFromUI();
                area = getPolygonArea(verts);
                updateSVGShape(verts);
            }
            const tatami = (area / 1.62).toFixed(1);
            document.getElementById('room-tatami-display').innerText = `約 ${tatami} 畳`;
        }

        function getPolygonArea(vertices) {
            let area = 0, n = vertices.length;
            if (n < 3) return 0;
            for (let i = 0; i < n; i++) {
                let j = (i + 1) % n;
                area += vertices[i].x * vertices[j].z - vertices[j].x * vertices[i].z;
            }
            return Math.abs(area / 2);
        }

        // --- Tabs ---
        function switchRoomType(type) {
            uiRoomType = type;
            if (type === 'rect') {
                document.getElementById('tab-rect').className = "flex-1 text-sm font-bold text-blue-600 border-b-2 border-blue-600 pb-2 transition-all";
                document.getElementById('tab-custom').className = "flex-1 text-sm font-medium text-gray-400 border-b-2 border-transparent pb-2 hover:text-gray-600 transition-all";
                document.getElementById('panel-rect').classList.remove('hidden');
                document.getElementById('panel-custom').classList.add('hidden');
            } else {
                document.getElementById('tab-custom').className = "flex-1 text-sm font-bold text-blue-600 border-b-2 border-blue-600 pb-2 transition-all";
                document.getElementById('tab-rect').className = "flex-1 text-sm font-medium text-gray-400 border-b-2 border-transparent pb-2 hover:text-gray-600 transition-all";
                document.getElementById('panel-custom').classList.remove('hidden');
                document.getElementById('panel-rect').classList.add('hidden');
            }
            onRoomShapeModified();
        }
        document.getElementById('tab-rect').addEventListener('click', () => switchRoomType('rect'));
        document.getElementById('tab-custom').addEventListener('click', () => switchRoomType('custom'));

        // --- Rect Presets ---
        document.getElementById('room-preset').addEventListener('change', (e) => {
            const val = e.target.value;
            if (!val) return;
            const w = val === "4.5" ? 273 : (val === "6" ? 273 : 364);
            const d = val === "4.5" ? 273 : (val === "6" ? 364 : (val === "8" ? 364 : (val === "10" ? 455 : 546)));
            document.getElementById('room-width').value = w;
            document.getElementById('room-depth').value = d;
            onRoomShapeModified();
        });
        document.getElementById('room-width').addEventListener('input', onRoomShapeModified);
        document.getElementById('room-depth').addEventListener('input', onRoomShapeModified);

        // --- Update Room ---
        document.getElementById('btn-update-room').addEventListener('click', async () => {
            if (uiRoomType === 'rect') {
                const w = parseFloat(document.getElementById('room-width').value) / 100;
                const d = parseFloat(document.getElementById('room-depth').value) / 100;
                await updateDoc(getRoomDocRef(), { type: 'rect', width: w, depth: d });
            } else {
                const verts = getVerticesFromUI();
                await updateDoc(getRoomDocRef(), { type: 'custom', vertices: verts });
            }
            showToast("部屋の形を更新しました", "success");
        });

        // --- Custom Shape Presets & UI ---
        function setVerticesUI(verts) {
            renderVertexUI(verts);
            onRoomShapeModified();
        }
        document.getElementById('btn-preset-l').addEventListener('click', () => setVerticesUI([{x:0,z:0},{x:4,z:0},{x:4,z:2},{x:2,z:2},{x:2,z:4},{x:0,z:4}]));
        document.getElementById('btn-preset-u').addEventListener('click', () => setVerticesUI([{x:0,z:0},{x:4,z:0},{x:4,z:4},{x:3,z:4},{x:3,z:1},{x:1,z:1},{x:1,z:4},{x:0,z:4}]));
        document.getElementById('btn-preset-t').addEventListener('click', () => setVerticesUI([{x:0,z:0},{x:4,z:0},{x:4,z:2},{x:3,z:2},{x:3,z:4},{x:1,z:4},{x:1,z:2},{x:0,z:2}]));

        function renderVertexUI(vertices) {
            const container = document.getElementById('vertex-container');
            container.innerHTML = '';
            vertices.forEach((v, i) => {
                const div = document.createElement('div');
                div.className = "flex gap-2 items-center bg-white p-2 rounded-lg border border-gray-200";
                div.innerHTML = `
                    <span class="text-xs font-bold text-gray-500 w-4">${i+1}</span>
                    <div class="flex-1 flex items-center bg-gray-50 rounded px-2">
                        <span class="text-xs text-gray-400 mr-1">X:</span>
                        <input type="number" step="10" value="${Math.round(v.x * 100)}" class="vert-x w-full bg-transparent text-xs py-1 outline-none" data-idx="${i}">
                    </div>
                    <div class="flex-1 flex items-center bg-gray-50 rounded px-2">
                        <span class="text-xs text-gray-400 mr-1">Z:</span>
                        <input type="number" step="10" value="${Math.round(v.z * 100)}" class="vert-z w-full bg-transparent text-xs py-1 outline-none" data-idx="${i}">
                    </div>
                    <button class="btn-del-vert text-red-400 hover:text-red-600 px-1" data-idx="${i}">×</button>
                `;
                container.appendChild(div);
            });
            container.querySelectorAll('input').forEach(inp => inp.addEventListener('change', onRoomShapeModified));
            container.querySelectorAll('.btn-del-vert').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.dataset.idx);
                    const verts = getVerticesFromUI();
                    verts.splice(idx, 1);
                    setVerticesUI(verts);
                });
            });
        }

        document.getElementById('btn-add-vertex').addEventListener('click', () => {
            const verts = getVerticesFromUI();
            verts.push({x: 0, z: 0});
            setVerticesUI(verts);
        });

        function getVerticesFromUI() {
            const verts = [];
            const container = document.getElementById('vertex-container');
            const rows = container.children;
            for(let i=0; i<rows.length; i++) {
                const x = parseFloat(rows[i].querySelector('.vert-x').value) / 100 || 0;
                const z = parseFloat(rows[i].querySelector('.vert-z').value) / 100 || 0;
                verts.push({x, z});
            }
            return verts;
        }

        // --- SVG Editor (Draggable with Numbers) ---
        let draggedVertIdx = -1;
        const svgElement = document.getElementById('shape-editor-svg');

        function updateSVGShape(vertices) {
            const poly = document.getElementById('shape-polygon');
            const circlesGroup = document.getElementById('shape-circles');
            
            const pointsStr = vertices.map(v => `${v.x},${v.z}`).join(' ');
            poly.setAttribute('points', pointsStr);
            
            circlesGroup.innerHTML = '';
            vertices.forEach((v, i) => {
                // Circle
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', v.x);
                circle.setAttribute('cy', v.z);
                circle.setAttribute('r', '0.3');
                circle.setAttribute('fill', '#3b82f6');
                circle.setAttribute('cursor', 'pointer');
                circle.setAttribute('class', 'draggable-vert');
                circle.dataset.idx = i;
                
                // Number Text
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', v.x);
                text.setAttribute('y', v.z + 0.1);
                text.setAttribute('font-size', '0.35');
                text.setAttribute('fill', 'white');
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('pointer-events', 'none');
                text.textContent = i + 1;

                circlesGroup.appendChild(circle);
                circlesGroup.appendChild(text);

                // Touch/Mouse Events for Dragging
                circle.addEventListener('mousedown', (e) => startDrag(e, i));
                circle.addEventListener('touchstart', (e) => startDrag(e, i), {passive: false});
            });
        }

        function startDrag(e, idx) {
            e.preventDefault();
            draggedVertIdx = idx;
        }

        function handleDrag(e) {
            if (draggedVertIdx === -1) return;
            e.preventDefault();
            
            const pt = svgElement.createSVGPoint();
            if (e.touches) {
                pt.x = e.touches[0].clientX;
                pt.y = e.touches[0].clientY;
            } else {
                pt.x = e.clientX;
                pt.y = e.clientY;
            }
            
            const svgP = pt.matrixTransform(svgElement.getScreenCTM().inverse());
            
            // Snap to 0.1m grid (10cm)
            const snapX = Math.round(svgP.x * 10) / 10;
            const snapZ = Math.round(svgP.y * 10) / 10;
            
            const verts = getVerticesFromUI();
            verts[draggedVertIdx].x = snapX;
            verts[draggedVertIdx].z = snapZ;
            setVerticesUI(verts);
        }

        function endDrag() { draggedVertIdx = -1; }

        window.addEventListener('mousemove', handleDrag);
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchmove', handleDrag, {passive: false});
        window.addEventListener('touchend', endDrag);


        // --- Add Furniture ---
        document.querySelectorAll('.btn-quick-add').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const b = e.currentTarget;
                const furnW = parseFloat(b.dataset.w) / 100;
                const furnH = parseFloat(b.dataset.h) / 100;
                const furnD = parseFloat(b.dataset.d) / 100;
                await addDoc(getItemsCollectionRef(), {
                    name: b.dataset.name,
                    w: furnW, h: furnH, d: furnD,
                    x: 0, y: furnH / 2, z: 0,
                    color: b.dataset.color,
                    rotY: 0
                });
                showToast(`${b.dataset.name} を追加しました`, "success");
            });
        });

        document.getElementById('btn-add-furn').addEventListener('click', async () => {
            const name = document.getElementById('furn-name').value || '家具';
            const w = parseFloat(document.getElementById('furn-w').value) / 100;
            const h = parseFloat(document.getElementById('furn-h').value) / 100;
            const d = parseFloat(document.getElementById('furn-d').value) / 100;
            const color = document.getElementById('furn-color').value;

            await addDoc(getItemsCollectionRef(), {
                name, w, h, d,
                x: 0, y: h / 2, z: 0,
                color, rotY: 0
            });
            showToast(`${name} を追加しました`, "success");
        });


        // --- Three.js Implementation ---
        let scene, camera, renderer, gridHelper, dragControls;
        let roomMesh = null;
        let meshMap = {};
        let selectedItemMesh = null;

        function initThreeJS() {
            if(scene) return;
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf3f4f6);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 8, 8);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);

            gridHelper = new THREE.GridHelper(20, 20, 0x000000, 0x000000);
            gridHelper.material.opacity = 0.1;
            gridHelper.material.transparent = true;
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            // Drag controls logic
            dragControls = new THREE.DragControls([], camera, renderer.domElement);
            dragControls.addEventListener('dragstart', function (event) {
                event.object.material.emissive.setHex(0x333333);
                selectFurniture(event.object);
            });
            dragControls.addEventListener('drag', function (event) {
                event.object.position.y = event.object.userData.h / 2; // Keep on floor
            });
            dragControls.addEventListener('dragend', async function (event) {
                event.object.material.emissive.setHex(0x000000);
                const obj = event.object;
                await updateDoc(getItemDocRef(obj.userData.id), {
                    x: obj.position.x,
                    z: obj.position.z
                });
            });

            window.addEventListener('resize', onWindowResize);
            
            // View Toggles
            document.getElementById('btn-view-3d').addEventListener('click', () => {
                camera.position.set(0, 8, 8);
                camera.lookAt(0, 0, 0);
            });
            document.getElementById('btn-view-2d').addEventListener('click', () => {
                camera.position.set(0, 15, 0);
                camera.lookAt(0, 0, 0);
            });
            document.getElementById('btn-toggle-grid').addEventListener('click', (e) => {
                gridHelper.visible = !gridHelper.visible;
                e.target.innerText = gridHelper.visible ? "マス目 ON" : "マス目 OFF";
            });

            animate();
        }

        function onWindowResize() {
            if(!camera || !renderer) return;
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if(renderer && scene && camera) renderer.render(scene, camera);
        }

        // Render Room Floors/Walls
        function updateRoomVisuals() {
            if(!scene) return;
            if(roomMesh) { scene.remove(roomMesh); roomMesh = null; }

           const material = new THREE.MeshLambertMaterial({ 
    color: a9a9a9,       // 好きな色（16進数）に変更。0xの後にカラーコードを書きます
    side: THREE.DoubleSide,
    transparent: true,     // 透明度を有効にする
    opacity: 0.7           // 濃さ（1.0で完全に不透明、0.0で完全な透明）
});
            let geometry;

            if(state.room.type === 'rect') {
                geometry = new THREE.PlaneGeometry(state.room.width, state.room.depth);
            } else {
                if(state.room.vertices.length < 3) return;
                const shape = new THREE.Shape();
                state.room.vertices.forEach((v, i) => {
                    if (i === 0) shape.moveTo(v.x, -v.z);
                    else shape.lineTo(v.x, -v.z);
                });
                geometry = new THREE.ShapeGeometry(shape);
            }

            roomMesh = new THREE.Mesh(geometry, material);
            roomMesh.rotation.x = -Math.PI / 2;
            roomMesh.receiveShadow = true;
            scene.add(roomMesh);
        }

        // Render Furniture
        function syncVisualsWithState() {
            if(!scene || !dragControls) return;

            // Remove deleted items
            const currentIds = state.items.map(i => i.id);
            Object.keys(meshMap).forEach(id => {
                if(!currentIds.includes(id)) {
                    scene.remove(meshMap[id]);
                    if(selectedItemMesh === meshMap[id]) deselectFurniture();
                    delete meshMap[id];
                }
            });

            // Update or add items
            const draggables = [];
            state.items.forEach(item => {
                let mesh = meshMap[item.id];
                if(!mesh) {
                    const geo = new THREE.BoxGeometry(item.w, item.h, item.d);
                    const mat = new THREE.MeshLambertMaterial({ color: item.color || 0xcccccc });
                    mesh = new THREE.Mesh(geo, mat);
                    mesh.castShadow = true;
                    mesh.userData = { id: item.id, name: item.name, h: item.h };
                    scene.add(mesh);
                    meshMap[item.id] = mesh;
                }
                mesh.position.set(item.x, item.y, item.z);
                mesh.rotation.y = item.rotY || 0;
                draggables.push(mesh);
            });
            
            dragControls.transformGroup = true;
            dragControls.getObjects().length = 0;
            draggables.forEach(d => dragControls.getObjects().push(d));
        }

        // Furniture Selection UI
        function selectFurniture(mesh) {
            selectedItemMesh = mesh;
            const ctrl = document.getElementById('selected-controls');
            ctrl.classList.remove('hidden');
            document.getElementById('sel-furn-name').innerText = mesh.userData.name;
        }

        function deselectFurniture() {
            selectedItemMesh = null;
            document.getElementById('selected-controls').classList.add('hidden');
        }

        document.getElementById('btn-rot-furn').addEventListener('click', async () => {
            if(!selectedItemMesh) return;
            const id = selectedItemMesh.userData.id;
            const currentRot = selectedItemMesh.rotation.y;
            await updateDoc(getItemDocRef(id), { rotY: currentRot + Math.PI / 2 });
        });

        document.getElementById('btn-del-furn').addEventListener('click', async () => {
            if(!selectedItemMesh) return;
            await deleteDoc(getItemDocRef(selectedItemMesh.userData.id));
            deselectFurniture();
        });

    </script>
</body>
</html>
