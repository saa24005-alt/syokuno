<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Room Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; touch-action: none; font-family: 'Inter', sans-serif; }
        #canvas-container canvas { display: block; outline: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen w-screen flex flex-col overflow-hidden">

    <!-- Toast Notification System -->
    <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 bg-white z-40 flex flex-col items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 text-center border border-gray-100">
            <div class="mb-6 flex justify-center">
                <svg class="w-16 h-16 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </div>
            <h1 class="text-3xl font-bold mb-2 text-gray-800">3D Room Planner</h1>
            <p class="text-gray-500 mb-8 text-sm">部屋の大きさを設定して、家具を自由に配置しましょう。データはクラウドに保存されます。</p>
            
            <button id="btn-google-login" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-xl shadow-sm hover:bg-gray-50 active:bg-gray-100 transition duration-200 mb-4">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Googleでログイン
            </button>
            <button id="btn-guest-login" class="w-full text-gray-500 font-medium py-2 hover:text-gray-700 transition duration-200">
                お試しで始める（ゲスト）
            </button>
            
            <p class="text-xs text-gray-400 mt-6 text-left">※GitHub Pages等で動かす場合は、コード内のFirebase Configをご自身のものに書き換えてください。</p>
        </div>
    </div>

    <!-- Main App UI -->
    <div id="main-app" class="flex-1 flex flex-row hidden w-full h-full relative overflow-hidden">
        <!-- 3D Canvas Area -->
        <div id="canvas-container" class="flex-1 relative bg-gray-200 shadow-inner w-full h-full cursor-pointer">
            <div class="absolute top-4 left-4 right-4 flex justify-between pointer-events-none z-10">
                <div class="bg-white/90 backdrop-blur-sm px-4 py-2 rounded-xl text-sm font-bold shadow-md pointer-events-auto text-gray-700">
                    <span id="ui-username">...</span>
                </div>
                <button id="btn-logout" class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-red-100 pointer-events-auto transition">
                    ログアウト
                </button>
            </div>
            
            <!-- View Mode Toggle -->
            <div class="absolute top-16 left-4 z-10 pointer-events-auto flex flex-col gap-2">
                <div class="bg-white rounded-xl shadow-md p-1 flex gap-1 border border-gray-200">
                    <button id="btn-view-3d" class="px-3 py-1.5 text-sm font-bold rounded-lg bg-blue-100 text-blue-700 transition">3D斜め</button>
                    <button id="btn-view-2d" class="px-3 py-1.5 text-sm font-bold rounded-lg text-gray-500 hover:bg-gray-50 transition">2D真上</button>
                </div>
                <div class="bg-white rounded-xl shadow-md p-1 flex border border-gray-200 w-max">
                    <button id="btn-toggle-grid" class="px-3 py-1.5 text-sm font-bold rounded-lg bg-blue-100 text-blue-700 transition w-full shadow-sm">マス目 ON</button>
                </div>
            </div>

            <!-- Mobile Panel Toggle Button -->
            <button id="btn-toggle-panel" class="md:hidden absolute bottom-6 right-4 bg-blue-600 text-white px-5 py-3 rounded-full shadow-lg font-bold text-sm z-20 pointer-events-auto flex items-center gap-2 hover:bg-blue-700 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                家具・設定
            </button>

            <!-- Labels Container -->
            <div id="labels-container" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>
        </div>

        <!-- Controls Panel -->
        <div id="controls-panel" class="absolute md:relative bottom-0 left-0 w-full md:w-96 lg:w-[400px] bg-gray-50 md:border-l border-gray-200 shadow-[0_-10px_40px_rgba(0,0,0,0.15)] md:shadow-2xl z-30 flex flex-col h-[65vh] md:h-full transition-transform duration-300 translate-y-0 md:translate-y-0 rounded-t-3xl md:rounded-none">
            <!-- Mobile Close Handle -->
            <div id="btn-close-panel" class="md:hidden w-full h-8 flex items-center justify-center cursor-pointer pt-2 pb-1 active:bg-gray-100 rounded-t-3xl">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
            </div>

            <div class="px-5 pb-5 pt-2 md:pt-5 bg-white border-b border-gray-200 flex-shrink-0 shadow-sm z-10">
                <h2 class="text-xl font-extrabold text-gray-800 flex items-center gap-2">
                    <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    部屋 & 家具の設定
                </h2>
            </div>
            
            <div class="flex-1 overflow-y-auto p-5 space-y-6 hide-scrollbar">
                <!-- Room Size Settings -->
                <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm">
                    <h3 class="text-base font-bold text-gray-800 mb-4 flex justify-between items-center">
                        <span>部屋の形とサイズ</span>
                        <span id="room-tatami-display" class="bg-blue-100 text-blue-800 text-sm font-extrabold px-3 py-1 rounded-lg">約 -- 畳</span>
                    </h3>
                    
                    <!-- Tabs -->
                    <div class="flex gap-2 mb-5">
                        <button id="tab-rect" class="flex-1 text-sm font-bold text-blue-600 border-b-2 border-blue-600 pb-2 transition-all">四角形</button>
                        <button id="tab-custom" class="flex-1 text-sm font-medium text-gray-400 border-b-2 border-transparent pb-2 hover:text-gray-600 transition-all">自由な形</button>
                    </div>

                    <!-- Rect Panel -->
                    <div id="panel-rect" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1.5">広さの目安（畳）から選ぶ</label>
                            <select id="room-preset" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 text-sm font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
                                <option value="">（カスタムサイズ）</option>
                                <option value="4.5">4.5畳 (約273cm × 273cm)</option>
                                <option value="6" selected>6畳 (約273cm × 364cm)</option>
                                <option value="8">8畳 (約364cm × 364cm)</option>
                                <option value="10">10畳 (約364cm × 455cm)</option>
                                <option value="12">12畳 (約364cm × 546cm)</option>
                            </select>
                        </div>

                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="block text-sm font-medium text-gray-600 mb-1.5">幅 (X軸・cm)</label>
                                <input type="number" id="room-width" value="273" step="1" min="10" max="2000" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
                            </div>
                            <div class="flex-1">
                                <label class="block text-sm font-medium text-gray-600 mb-1.5">奥行き (Z軸・cm)</label>
                                <input type="number" id="room-depth" value="364" step="1" min="10" max="2000" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-colors">
                            </div>
                        </div>
                    </div>

                    <!-- Custom Shape Panel -->
                    <div id="panel-custom" class="hidden space-y-4">
                        <div class="bg-blue-50 text-blue-800 text-xs p-3 rounded-xl border border-blue-200">
                            💡 下の図の <strong>青い丸（頂点）を指でドラッグ</strong> すると、部屋の形を自由に変更できます。<br>
                            <span class="text-blue-600 mt-1 inline-block">（番号の順番に線が繋がって壁になります）</span>
                        </div>
                        
                        <!-- SVG Map Editor -->
                        <div id="shape-editor-container" class="w-full h-56 bg-white border border-gray-300 rounded-xl relative overflow-hidden touch-none shadow-inner">
                            <svg id="shape-editor-svg" viewBox="-6 -6 12 12" class="w-full h-full touch-none" preserveAspectRatio="xMidYMid meet">
                                <defs>
                                    <pattern id="grid" width="1" height="1" patternUnits="userSpaceOnUse">
                                        <path d="M 1 0 L 0 0 0 1" fill="none" stroke="#e5e7eb" stroke-width="0.05"/>
                                    </pattern>
                                    <!-- 中央の基準線 -->
                                    <pattern id="grid-center" width="12" height="12" patternUnits="userSpaceOnUse">
                                        <path d="M 6 0 L 6 12 M 0 6 L 12 6" fill="none" stroke="#9ca3af" stroke-width="0.08"/>
                                    </pattern>
                                </defs>
                                <rect x="-6" y="-6" width="12" height="12" fill="url(#grid)" />
                                <rect x="-6" y="-6" width="12" height="12" fill="url(#grid-center)" />
                                <polygon id="shape-polygon" points="" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="0.1" stroke-linejoin="round"/>
                                <g id="shape-circles"></g>
                            </svg>
                        </div>
                        
                        <!-- Presets -->
                        <div class="grid grid-cols-3 gap-2">
                            <button id="btn-preset-l" class="bg-white border border-gray-300 text-gray-700 rounded-xl py-2 text-xs font-bold hover:bg-gray-50 shadow-sm transition">L字型</button>
                            <button id="btn-preset-u" class="bg-white border border-gray-300 text-gray-700 rounded-xl py-2 text-xs font-bold hover:bg-gray-50 shadow-sm transition">コの字型</button>
                            <button id="btn-preset-t" class="bg-white border border-gray-300 text-gray-700 rounded-xl py-2 text-xs font-bold hover:bg-gray-50 shadow-sm transition">T字型</button>
                        </div>

                        <!-- Manual Coordinate Editor (Collapsible) -->
                        <details class="bg-gray-50 border border-gray-200 rounded-xl shadow-sm">
                            <summary class="px-4 py-3 text-sm font-bold text-gray-700 cursor-pointer outline-none hover:bg-gray-100 transition rounded-xl">
                                ＋ 数値で微調整（高度な設定）
                            </summary>
                            <div class="p-3 border-t border-gray-200">
                                <label class="block text-xs font-medium text-gray-500 mb-2">頂点座標 (cm) - ぐるっと一周する順番で入力</label>
                                <div id="vertex-container" class="space-y-2.5 max-h-40 overflow-y-auto p-1">
                                    <!-- 頂点入力が動的に入る -->
                                </div>
                                <button id="btn-add-vertex" class="mt-3 w-full bg-white border border-gray-300 text-gray-700 rounded-lg py-2.5 text-sm font-bold hover:bg-gray-50 shadow-sm transition">+ 頂点追加</button>
                            </div>
                        </details>
                    </div>

                    <button id="btn-update-room" class="mt-5 w-full bg-gray-800 text-white rounded-xl py-3 text-sm font-bold shadow-md hover:bg-gray-700 transition">
                        部屋の形を更新
                    </button>
                </div>

                <!-- Add Furniture -->
                <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm">
                    <h3 class="text-base font-bold text-gray-800 mb-4 border-b border-gray-100 pb-3">家具を追加</h3>
                    
                    <!-- Quick Add Preset Buttons -->
                    <div class="mb-5">
                        <label class="block text-sm font-medium text-gray-600 mb-2">よく使う家具（ワンタップ追加）</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button class="btn-quick-add flex justify-center items-center gap-1 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 py-2.5 rounded-xl text-sm font-bold border border-indigo-200 transition shadow-sm" data-name="ベッド" data-w="1.0" data-h="0.5" data-d="2.0" data-color="#4F46E5">🛏️ ベッド</button>
                            <button class="btn-quick-add flex justify-center items-center gap-1 bg-amber-50 text-amber-700 hover:bg-amber-100 py-2.5 rounded-xl text-sm font-bold border border-amber-200 transition shadow-sm" data-name="デスク" data-w="1.2" data-h="0.7" data-d="0.6" data-color="#D97706">💻 デスク</button>
                            <button class="btn-quick-add flex justify-center items-center gap-1 bg-gray-50 text-gray-700 hover:bg-gray-100 py-2.5 rounded-xl text-sm font-bold border border-gray-200 transition shadow-sm" data-name="チェア" data-w="0.5" data-h="0.9" data-d="0.5" data-color="#4B5563">🪑 チェア</button>
                            <button class="btn-quick-add flex justify-center items-center gap-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 py-2.5 rounded-xl text-sm font-bold border border-emerald-200 transition shadow-sm" data-name="ソファ" data-w="1.6" data-h="0.7" data-d="0.8" data-color="#10B981">🛋️ ソファ</button>
                            <button class="btn-quick-add flex justify-center items-center gap-1 bg-orange-50 text-orange-700 hover:bg-orange-100 py-2.5 rounded-xl text-sm font-bold border border-orange-200 transition shadow-sm" data-name="収納棚" data-w="0.8" data-h="1.8" data-d="0.3" data-color="#EA580C">🚪 収納棚</button>
                            <button class="btn-quick-add flex justify-center items-center gap-1 bg-rose-50 text-rose-700 hover:bg-rose-100 py-2.5 rounded-xl text-sm font-bold border border-rose-200 transition shadow-sm" data-name="テーブル" data-w="0.8" data-h="0.7" data-d="0.8" data-color="#E11D48">🍽️ テーブル</button>
                        </div>
                    </div>

                    <div class="border-t border-gray-100 pt-4">
                        <label class="block text-sm font-medium text-gray-600 mb-3">サイズを細かく指定して追加</label>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-600 mb-1.5">種類 / 名前</label>
                                <input type="text" id="furn-name" placeholder="例：テレビ台" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                            </div>
                            <div class="flex gap-4">
                                <div class="flex-1">
                                    <label class="block text-sm font-medium text-gray-600 mb-1.5">幅(W) cm</label>
                                    <input type="number" id="furn-w" value="100" step="1" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                                </div>
                                <div class="flex-1">
                                    <label class="block text-sm font-medium text-gray-600 mb-1.5">高さ(H) cm</label>
                                    <input type="number" id="furn-h" value="50" step="1" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                                </div>
                                <div class="flex-1">
                                    <label class="block text-sm font-medium text-gray-600 mb-1.5">奥行(D) cm</label>
                                    <input type="number" id="furn-d" value="200" step="1" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                                </div>
                            </div>
                        </div>
                        <div class="mt-4">
                            <label class="block text-sm font-medium text-gray-600 mb-1.5">色</label>
                            <input type="color" id="furn-color" value="#4F46E5" class="w-full h-12 rounded-xl cursor-pointer border border-gray-300 p-1 bg-gray-50">
                        </div>
                        <button id="btn-add-furn" class="w-full bg-blue-600 text-white rounded-xl py-3 text-sm font-bold shadow-md hover:bg-blue-700 transition flex items-center justify-center gap-2 mt-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                            家具を追加する
                        </button>
                    </div>
                </div>

                <!-- Selected Item Controls (Hidden by default) -->
                <div id="selected-controls" class="bg-blue-50 border-2 border-blue-200 rounded-2xl p-5 shadow-sm hidden">
                    <div class="flex items-center gap-2 mb-3">
                        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                        <h3 class="text-sm font-extrabold text-blue-800">選択中の家具</h3>
                    </div>
                    <p id="sel-furn-name" class="text-base text-gray-800 mb-4 font-bold bg-white px-3 py-2 rounded-lg border border-blue-100">---</p>
                    <div class="flex gap-3">
                        <button id="btn-rot-furn" class="flex-1 bg-white border border-blue-300 text-blue-700 rounded-xl py-2.5 text-sm font-bold shadow-sm hover:bg-blue-50 transition flex justify-center items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            90度回転
                        </button>
                        <button id="btn-del-furn" class="flex-1 bg-red-50 border border-red-200 text-red-600 rounded-xl py-2.5 text-sm font-bold shadow-sm hover:bg-red-100 transition flex justify-center items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            削除
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase System -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. Setup Environment and Firebase Config
        // ==========================================
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'room-planner-app';
        let firebaseConfig;
        
        if (typeof __firebase_config !== 'undefined') {
            firebaseConfig = JSON.parse(__firebase_config);
        } else {
            // ★ GitHub Pagesで動作させる場合は、ここに自身のFirebase設定を貼り付けてください
            firebaseConfig = {
                apiKey: "YOUR_API_KEY",
                authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
                projectId: "YOUR_PROJECT_ID",
                storageBucket: "YOUR_PROJECT_ID.appspot.com",
                messagingSenderId: "YOUR_SENDER_ID",
                appId: "YOUR_APP_ID"

        function getPolygonArea(vertices) {
            let area = 0;
            const n = vertices.length;
            if (n < 3) return 0;
            for (let i = 0; i < n; i++) {
                let j = (i + 1) % n;
                area += vertices[i].x * vertices[j].z;
                area -= vertices[j].x * vertices[i].z;
            }
            return Math.abs(area / 2);
        }

        function onRoomShapeModified() {
            let area = 0;
            if (uiRoomType === 'rect') {

                const d = (parseFloat(document.getElementById('room-depth').value) || 0) / 100;
                area = w * d;
            } else {
                const verts = getVerticesFromUI();
                area = getPolygonArea(verts);
                updateSVGShape(verts);
            }
            const tatami = (area / 1.62).toFixed(1);
            document.getElementById('room-tatami-display').innerText = `約 ${tatami} 畳`;
        }

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>

        // --- SVG Editor Logic ---
        let activeCircleIndex = -1;
        let svgIsDragging = false;
        const svg = document.getElementById('shape-editor-svg');

        function updateSVGShape(vertices) {
            const polygon = document.getElementById('shape-polygon');
            const circlesGroup = document.getElementById('shape-circles');
            if(!polygon || !circlesGroup) return;
            
            const pointsStr = vertices.map(v => `${v.x},${v.z}`).join(' ');
            polygon.setAttribute('points', pointsStr);
            
            circlesGroup.innerHTML = '';
            vertices.forEach((v, i) => {
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', v.x);
                circle.setAttribute('cy', v.z);
                circle.setAttribute('r', '0.5'); 
                circle.setAttribute('fill', '#2563eb');
                circle.setAttribute('stroke', '#ffffff');
                circle.setAttribute('stroke-width', '0.15');
                circle.setAttribute('class', 'cursor-grab touch-none');
                circle.style.pointerEvents = 'auto';
                
                circle.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    activeCircleIndex = i;
                    svgIsDragging = true;
                    circle.setAttribute('class', 'cursor-grabbing touch-none');
                    svg.setPointerCapture(e.pointerId);
                });
                
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', v.x);
                text.setAttribute('y', v.z);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('dominant-baseline', 'central');
                text.setAttribute('fill', '#ffffff');
                text.setAttribute('font-size', '0.45');
                text.setAttribute('font-weight', 'bold');
                text.setAttribute('class', 'pointer-events-none');
                text.textContent = i + 1;
                
                g.appendChild(circle);
                g.appendChild(text);
                circlesGroup.appendChild(g);
            });
        }

        svg.addEventListener('pointermove', (e) => {
            if(!svgIsDragging || activeCircleIndex === -1) return;
            e.preventDefault();
            const pt = svg.createSVGPoint();
            pt.x = e.clientX;
            pt.y = e.clientY;
            const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
            
            // 0.5m(50cm)単位でスナップ
            const snapX = Math.round(svgP.x * 2) / 2;
            const snapZ = Math.round(svgP.y * 2) / 2;
            
            const clampX = Math.max(-5.5, Math.min(5.5, snapX));
            const clampZ = Math.max(-5.5, Math.min(5.5, snapZ));
            
            updateVertexInput(activeCircleIndex, clampX, clampZ);
        });

        svg.addEventListener('pointerup', () => {
            svgIsDragging = false;
            activeCircleIndex = -1;
        });

        function initThreeJS() {
            if(scene) return; 
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf3f4f6);

            const aspect = container.clientWidth / container.clientHeight;
            camera = new THREE.PerspectiveCamera(50, aspect, 0.1, 1000);
            camera.position.set(0, 15, 10);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const baseGeo = new THREE.PlaneGeometry(100, 100);
            const baseMat = new THREE.MeshBasicMaterial({ visible: false });
            const basePlane = new THREE.Mesh(baseGeo, baseMat);
            basePlane.rotation.x = -Math.PI / 2;
            scene.add(basePlane);

            updateRoomVisuals();

            window.addEventListener('resize', onWindowResize);
            
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            renderer.domElement.addEventListener('pointermove', onPointerMove);
            renderer.domElement.addEventListener('pointerup', onPointerUp);
            renderer.domElement.addEventListener('pointercancel', onPointerUp);

            renderer.domElement.addEventListener('wheel', onMouseWheel, { passive: false });
            renderer.domElement.addEventListener('touchstart', onTouchStartPinch, { passive: false });

            renderer.domElement.addEventListener('touchend', onTouchEndPinch, { passive: false });

            animate();
        }

        function getGridTexture(withGrid) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#f9fafb'; 
            ctx.fillRect(0, 0, 128, 128);
            
            if (withGrid) {
                ctx.strokeStyle = '#d1d5db'; 
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, 128, 128);
            }
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function updateRoomVisuals() {
            if(!scene) return;
            
            if(floor) scene.remove(floor);

            let maxDim = 5;
            let centerX = 0;
            let centerZ = 0;

            if (state.room.type === 'rect') {
                const w = state.room.width;
                const d = state.room.depth;
                
                const geo = new THREE.PlaneGeometry(w, d);
                
                const pos = geo.attributes.position;
                const uv = geo.attributes.uv;
                for (let i = 0; i < pos.count; i++) {
                    uv.setXY(i, pos.getX(i), pos.getY(i));
                }
                uv.needsUpdate = true;

                const tex = getGridTexture(isGridVisible);

                const mat = new THREE.MeshStandardMaterial({ map: tex, side: THREE.DoubleSide });
                floor = new THREE.Mesh(geo, mat);
                floor.rotation.x = -Math.PI / 2;
                
                maxDim = Math.max(w, d);
            } else {
                const verts = state.room.vertices;
                if(verts && verts.length >= 3) {
                    const shape = new THREE.Shape();
                    shape.moveTo(verts[0].x, -verts[0].z);
                    
                    let minX = verts[0].x, maxX = verts[0].x;
                    let minZ = verts[0].z, maxZ = verts[0].z;

                    for(let i=1; i<verts.length; i++) {
                        shape.lineTo(verts[i].x, -verts[i].z);
                        minX = Math.min(minX, verts[i].x); 
                        maxX = Math.max(maxX, verts[i].x);
                        minZ = Math.min(minZ, verts[i].z); 
                        maxZ = Math.max(maxZ, verts[i].z);
                    }
                    shape.lineTo(verts[0].x, -verts[0].z); 

                    const geo = new THREE.ShapeGeometry(shape);
                    
                    const pos = geo.attributes.position;
                    const uv = geo.attributes.uv;
                    for (let i = 0; i < pos.count; i++) {
                        uv.setXY(i, pos.getX(i), pos.getY(i));
                    }
                    uv.needsUpdate = true;

                    const mat = new THREE.MeshStandardMaterial({ map: getGridTexture(isGridVisible), side: THREE.DoubleSide });
                    floor = new THREE.Mesh(geo, mat);
                    floor.rotation.x = -Math.PI / 2; 
                    
                    const w = maxX - minX;
                    const d = maxZ - minZ;
                    maxDim = Math.max(w, d);
                    
                    centerX = (minX + maxX) / 2;
                    centerZ = (minZ + maxZ) / 2;
                } else {
                    const geo = new THREE.PlaneGeometry(5, 5);
                    const pos = geo.attributes.position;
                    const uv = geo.attributes.uv;
                    for (let i = 0; i < pos.count; i++) {
                        uv.setXY(i, pos.getX(i), pos.getY(i));
                    }
                    uv.needsUpdate = true;
                    const tex = getGridTexture(isGridVisible);
                    const mat = new THREE.MeshStandardMaterial({ map: tex, side: THREE.DoubleSide });
                    floor = new THREE.Mesh(geo, mat);
                    floor.rotation.x = -Math.PI / 2;
                }
            }

            if(floor) {
                floor.receiveShadow = true;
                scene.add(floor);
            }
            
            updateCameraPosition();
        }

        function updateCameraPosition() {
            if(!camera) return;
            
            let maxDim = 5;
            let centerX = 0;
            let centerZ = 0;

            if (state.room.type === 'rect') {
                maxDim = Math.max(state.room.width, state.room.depth);
            } else {
                const verts = state.room.vertices;
                if(verts && verts.length >= 3) {
                    let minX = verts[0].x, maxX = verts[0].x;
                    let minZ = verts[0].z, maxZ = verts[0].z;
                    for(let i=1; i<verts.length; i++) {
                        minX = Math.min(minX, verts[i].x); maxX = Math.max(maxX, verts[i].x);
                        minZ = Math.min(minZ, verts[i].z); maxZ = Math.max(maxZ, verts[i].z);
                    }
                    maxDim = Math.max(maxX - minX, maxZ - minZ);
                    centerX = (minX + maxX) / 2;
                    centerZ = (minZ + maxZ) / 2;
                }
            }

            const aspect = container.clientWidth / container.clientHeight;
            
            if (viewMode === '3D') {
                const scaleFactor = aspect < 1 ? 1.2 / aspect : 1.2;
                const margin = 2.0 * scaleFactor; 
                camera.position.set(centerX, maxDim * margin, centerZ + maxDim * margin * 0.8);
                camera.lookAt(centerX, 0, centerZ);
            } else {
                const scaleFactor = aspect < 1 ? 1.0 / aspect : 1.0;
                camera.position.set(centerX, maxDim * 1.5 * scaleFactor, centerZ);
                camera.up.set(0, 0, -1);
                camera.lookAt(centerX, 0, centerZ);
                camera.up.set(0, 1, 0); 
            }
        }

        function syncVisualsWithState() {
            if(!scene) return;

            const currentIds = new Set(state.items.map(i => i.id));
            Object.keys(meshMap).forEach(id => {
                if(!currentIds.has(id)) {
                    scene.remove(meshMap[id]);
                    delete meshMap[id];
                    if(selectedMeshId === id) clearSelection();
                }
            });

            state.items.forEach(item => {
                let mesh = meshMap[item.id];
                if (!mesh) {
                    const geo = new THREE.BoxGeometry(item.w, item.h, item.d);
                    const mat = new THREE.MeshStandardMaterial({ color: item.color });
                    mesh = new THREE.Mesh(geo, mat);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    
                    const edges = new THREE.EdgesGeometry(geo);
                    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
                    mesh.add(line);
                    
                    mesh.userData.id = item.id;
                    scene.add(mesh);
                    meshMap[item.id] = mesh;
                }
                
                if (draggedMesh !== mesh) {
                    mesh.position.set(item.x, item.y, item.z);
                    mesh.rotation.y = item.rotY || 0;
                    
                    if(mesh.material.color.getHexString() !== item.color.replace('#','')) {
                        mesh.material.color.set(item.color);
                    }
                    
                    if(selectedMeshId === item.id) {
                        mesh.material.emissive.setHex(0x333333);
                    } else {
                        mesh.material.emissive.setHex(0x000000);
                    }
                }
            });
            
            updateLabels();
        }

        function updateLabels() {
            if (!camera || !renderer) return;
            const labelsContainer = document.getElementById('labels-container');
            const widthHalf = container.clientWidth / 2;
            const heightHalf = container.clientHeight / 2;

            const currentIds = new Set(state.items.map(i => i.id));
            Object.keys(labelMap).forEach(id => {
                if(!currentIds.has(id)) {
                    labelMap[id].remove();
                    delete labelMap[id];
                }
            });

            state.items.forEach(item => {
                let label = labelMap[item.id];
                if (!label) {
                    label = document.createElement('div');
                    label.className = 'absolute text-[10px] sm:text-xs font-bold text-gray-800 bg-white/90 px-1.5 py-0.5 rounded shadow-sm border border-gray-200 pointer-events-none transform -translate-x-1/2 -translate-y-1/2 whitespace-nowrap z-20';
                    labelsContainer.appendChild(label);
                    labelMap[item.id] = label;
                }
                
                label.innerText = item.name;

                const mesh = meshMap[item.id];
                if (mesh) {
                    const pos = mesh.position.clone();
                    pos.y += item.h / 2 + 0.2; 
                    pos.project(camera);

                    if (pos.z > 1) {
                        label.style.display = 'none';
                    } else {
                        label.style.display = 'block';
                        label.style.left = (pos.x * widthHalf + widthHalf) + 'px';
                        label.style.top = (-(pos.y * heightHalf) + heightHalf) + 'px';
                    }
                }
            });
        }

        function getPointerIntersect(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            return raycaster.intersectObjects(Object.values(meshMap));
        }

        function onPointerDown(event) {
            if (!event.isPrimary) return; 

            const intersects = getPointerIntersect(event);
            if (intersects.length > 0) {
                isDragging = true;
                draggedMesh = intersects[0].object;
                selectItem(draggedMesh.userData.id);
                
                raycaster.ray.intersectPlane(intersectionPlane, dragOffset);
                dragOffset.sub(draggedMesh.position);
                
                renderer.domElement.style.cursor = 'grabbing';
            } else {
                clearSelection();
            }
        }

        function onPointerMove(event) {
            if (!isDragging || !draggedMesh || !event.isPrimary) return;
            
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            
            const point = new THREE.Vector3();
            raycaster.ray.intersectPlane(intersectionPlane, point);
            
            if (point) {
                draggedMesh.position.x = point.x - dragOffset.x;
                draggedMesh.position.z = point.z - dragOffset.z;
            }
        }

        function onPointerUp(event) {
            if (isDragging && draggedMesh) {
                if(currentUserId) {
                    const id = draggedMesh.userData.id;
                    const {x, y, z} = draggedMesh.position;
                    setDoc(getItemDocRef(id), {x, y, z}, {merge: true}).catch(console.error);
                }
            }
            isDragging = false;
            draggedMesh = null;
            renderer.domElement.style.cursor = 'auto';
        }

        let initialPinchDistance = null;
        let initialCameraZoom = 1;

        function onMouseWheel(event) {
            event.preventDefault();
            const zoomSpeed = 0.1;
            if (event.deltaY > 0) {
                camera.zoom = Math.max(0.2, camera.zoom - zoomSpeed);
            } else {
                camera.zoom = Math.min(5.0, camera.zoom + zoomSpeed);
            }
            camera.updateProjectionMatrix();
            updateLabels();
        }

        function onTouchStartPinch(event) {
            if (event.touches.length === 2) {
                isDragging = false; 
                draggedMesh = null;
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
                initialCameraZoom = camera.zoom;
            }
        }

        function onTouchMovePinch(event) {
            if (event.touches.length === 2 && initialPinchDistance) {
                event.preventDefault();
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                const scale = distance / initialPinchDistance;
                camera.zoom = Math.max(0.2, Math.min(initialCameraZoom * scale, 5.0));
                camera.updateProjectionMatrix();
                updateLabels();
            }
        }
        
        function onTouchEndPinch(event) {
            if (event.touches.length < 2) {
                initialPinchDistance = null;
            }
        }

        function selectItem(id) {
            selectedMeshId = id;
            const item = state.items.find(i => i.id === id);
            
            if(item) {
                document.getElementById('selected-controls').classList.remove('hidden');
                // UI上は分かりやすくcmで表示
                const w_cm = Math.round(item.w * 100);
                const h_cm = Math.round(item.h * 100);
                const d_cm = Math.round(item.d * 100);
                document.getElementById('sel-furn-name').innerText = `${item.name} (${w_cm}x${h_cm}x${d_cm}cm)`;
            }
            syncVisualsWithState();
        }

        function clearSelection() {
            selectedMeshId = null;
            document.getElementById('selected-controls').classList.add('hidden');
            syncVisualsWithState();
        }

        function onWindowResize() {
            if(!camera || !renderer) return;
            const aspect = container.clientWidth / container.clientHeight;
            camera.aspect = aspect;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            updateCameraPosition();
            updateLabels();
        }

        function animate() {
            requestAnimationFrame(animate);
            if(renderer && scene && camera) {
                renderer.render(scene, camera);
                updateLabels();
            }
        }
    </script>
</body>
</html>
