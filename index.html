<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新生活サポートメモ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: M PLUS Rounded 1c -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #EFF6FF; /* blue-50 */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* カスタムスクロールバー（非表示気味にする） */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #BFDBFE;
            border-radius: 10px;
        }
        
        .btn-primary {
            @apply w-full py-4 bg-blue-500 text-white rounded-full text-xl font-bold shadow-lg shadow-blue-500/30 transition-transform active:scale-95 flex justify-center items-center gap-2;
        }
        
        .btn-secondary {
            @apply w-full py-4 bg-white text-blue-600 border-2 border-blue-200 rounded-full text-xl font-bold shadow-sm transition-transform active:scale-95;
        }
        
        .btn-danger {
            @apply w-full py-4 bg-red-400 text-white rounded-full text-xl font-bold shadow-md shadow-red-400/30 transition-transform active:scale-95;
        }
        
        .input-large {
            @apply w-full p-4 rounded-2xl border-2 border-blue-100 bg-white text-lg focus:outline-none focus:border-blue-400 focus:ring-4 focus:ring-blue-100 transition-all;
        }
        
        .task-card {
            @apply bg-white p-5 rounded-3xl shadow-sm border border-blue-50 mb-4 transition-all;
        }
        
        /* 完了時のアニメーション用 */
        .task-done {
            @apply opacity-60 bg-gray-50;
        }
        .task-done .task-text {
            @apply line-through text-gray-500;
        }
        
        /* モーダル表示時の背景固定 */
        body.modal-open {
            overflow: hidden;
        }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 環境変数の取得
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // ダミー設定 (実際の環境では自動で上書きされます)
            apiKey: "dummy", authDomain: "dummy", projectId: "dummy"
        };

        // Firebase初期化
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // アプリの状態
        let currentUser = null;
        let tasks = [];
        let unsubscribeTasks = null;
        let currentEditId = null;
        let currentDeleteId = null;

        // DOM要素
        const screens = {
            loading: document.getElementById('screen-loading'),
            login: document.getElementById('screen-login'),
            main: document.getElementById('screen-main')
        };
        const taskListEl = document.getElementById('task-list');
        const emptyStateEl = document.getElementById('empty-state');
        const loginBtn = document.getElementById('btn-login');
        const logoutBtn = document.getElementById('btn-logout');
        
        // フォーム要素
        const formTask = document.getElementById('form-task');
        const inputTask = document.getElementById('input-task');
        const selectCategory = document.getElementById('select-category');
        
        // モーダル要素
        const editModal = document.getElementById('modal-edit');
        const deleteModal = document.getElementById('modal-delete');
        const editInputTask = document.getElementById('edit-input-task');
        const editSelectCategory = document.getElementById('edit-select-category');

        // カテゴリの絵文字マッピング
        const categoryIcons = {
            'shopping': '🛒',
            'chore': '🧹',
            'procedure': '📝',
            'other': '💡'
        };
        const categoryNames = {
            'shopping': 'お買い物',
            'chore': '家事',
            'procedure': '手続き',
            'other': 'その他'
        };

        // UI切り替え
        function showScreen(screenName) {
            Object.values(screens).forEach(el => el.classList.add('hidden'));
            screens[screenName].classList.remove('hidden');
        }

        // ログイン処理
        async function handleLogin() {
            loginBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-6 w-6 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                ログイン中...
            `;
            loginBtn.disabled = true;

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Login Error:", error);
                loginBtn.innerHTML = `Googleアカウントで始める`;
                loginBtn.disabled = false;
                showToast("ログインに失敗しました。再試行してください。");
            }
        }

        // ログアウト処理
        async function handleLogout() {
            try {
                if (unsubscribeTasks) unsubscribeTasks();
                await signOut(auth);
            } catch (error) {
                console.error("Logout Error:", error);
            }
        }

        // 認証状態の監視
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                // UI更新
                showScreen('main');
                loadTasks();
            } else {
                currentUser = null;
                tasks = [];
                renderTasks();
                showScreen('login');
                loginBtn.innerHTML = `はじめる`;
                loginBtn.disabled = false;
            }
        });

        // タスクの読み込み (Firestore)
        function loadTasks() {
            if (!currentUser) return;

            // Strict Path Rules に準拠: artifacts/{appId}/users/{userId}/{collection}
            const tasksRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'tasks');
            
            // Complex Queries 禁止のルールに準拠し、全件取得してJSでソートする
            unsubscribeTasks = onSnapshot(tasksRef, (snapshot) => {
                tasks = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                // JSメモリ内でソート (未完了を上に、作成日時が新しいものを上に)
                tasks.sort((a, b) => {
                    if (a.isDone !== b.isDone) return a.isDone ? 1 : -1;
                    return b.createdAt - a.createdAt;
                });

                renderTasks();
            }, (error) => {
                console.error("Error loading tasks:", error);
                showToast("データの読み込みに失敗しました。");
            });
        }

        // タスクの追加
        async function addTask(e) {
            e.preventDefault();
            if (!currentUser) return;

            const text = inputTask.value.trim();
            const category = selectCategory.value;

            if (!text) return;

            const submitBtn = formTask.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = "追加中...";
            submitBtn.disabled = true;

            try {
                const tasksRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'tasks');
                await addDoc(tasksRef, {
                    text: text,
                    category: category,
                    isDone: false,
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                });
                
                inputTask.value = '';
                showToast("追加しました！");
            } catch (error) {
                console.error("Error adding task:", error);
                showToast("追加に失敗しました。");
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        }

        // タスクの完了状態トグル
        async function toggleTaskStatus(id, currentStatus) {
            if (!currentUser) return;
            try {
                const taskRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'tasks', id);
                await updateDoc(taskRef, {
                    isDone: !currentStatus,
                    updatedAt: Date.now()
                });
                
                if (!currentStatus) {
                    showToast("お疲れ様です！一つクリアしましたね✨");
                }
            } catch (error) {
                console.error("Error toggling task:", error);
            }
        }

        // --- 編集モーダル関連 ---
        window.openEditModal = function(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            
            currentEditId = id;
            editInputTask.value = task.text;
            editSelectCategory.value = task.category;
            
            editModal.classList.remove('hidden');
            editModal.classList.add('flex');
            document.body.classList.add('modal-open');
        }

        window.closeEditModal = function() {
            currentEditId = null;
            editModal.classList.add('hidden');
            editModal.classList.remove('flex');
            document.body.classList.remove('modal-open');
        }

        async function saveEditTask() {
            if (!currentUser || !currentEditId) return;
            
            const newText = editInputTask.value.trim();
            const newCategory = editSelectCategory.value;
            
            if (!newText) {
                showToast("内容を入力してください");
                return;
            }

            try {
                const taskRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'tasks', currentEditId);
                await updateDoc(taskRef, {
                    text: newText,
                    category: newCategory,
                    updatedAt: Date.now()
                });
                closeEditModal();
                showToast("保存しました");
            } catch (error) {
                console.error("Error editing task:", error);
                showToast("保存に失敗しました");
            }
        }

        // --- 削除モーダル関連 ---
        window.openDeleteModal = function(id) {
            currentDeleteId = id;
            deleteModal.classList.remove('hidden');
            deleteModal.classList.add('flex');
            document.body.classList.add('modal-open');
        }

        window.closeDeleteModal = function() {
            currentDeleteId = null;
            deleteModal.classList.add('hidden');
            deleteModal.classList.remove('flex');
            document.body.classList.remove('modal-open');
        }

        async function confirmDeleteTask() {
            if (!currentUser || !currentDeleteId) return;
            try {
                const taskRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'tasks', currentDeleteId);
                await deleteDoc(taskRef);
                closeDeleteModal();
                showToast("削除しました");
            } catch (error) {
                console.error("Error deleting task:", error);
                showToast("削除に失敗しました");
            }
        }

        // レンダリング
        function renderTasks() {
            taskListEl.innerHTML = '';
            
            if (tasks.length === 0) {
                emptyStateEl.classList.remove('hidden');
                return;
            }
            
            emptyStateEl.classList.add('hidden');

            tasks.forEach(task => {
                const el = document.createElement('div');
                el.className = `task-card ${task.isDone ? 'task-done' : ''}`;
                
                const icon = categoryIcons[task.category] || categoryIcons['other'];
                const categoryName = categoryNames[task.category] || categoryNames['other'];

                el.innerHTML = `
                    <div class="flex items-start gap-4">
                        <!-- カスタムチェックボックス (大きく押しやすく) -->
                        <button onclick="window.toggleTask('${task.id}', ${task.isDone})" 
                                class="flex-shrink-0 w-12 h-12 rounded-full border-4 ${task.isDone ? 'border-blue-400 bg-blue-400 text-white' : 'border-gray-200 bg-white'} flex items-center justify-center transition-colors shadow-sm">
                            ${task.isDone ? '<svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : ''}
                        </button>
                        
                        <div class="flex-1 min-w-0 pt-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full font-bold">
                                    ${icon} ${categoryName}
                                </span>
                            </div>
                            <h3 class="task-text text-xl font-bold text-gray-800 break-words leading-tight">
                                ${escapeHtml(task.text)}
                            </h3>
                        </div>
                    </div>
                    
                    <div class="mt-4 flex justify-end gap-3 border-t border-gray-100 pt-3">
                        <button onclick="window.openEditModal('${task.id}')" class="px-5 py-2 bg-blue-50 text-blue-600 rounded-full font-bold text-sm active:bg-blue-100">
                            編集
                        </button>
                        <button onclick="window.openDeleteModal('${task.id}')" class="px-5 py-2 bg-red-50 text-red-500 rounded-full font-bold text-sm active:bg-red-100">
                            削除
                        </button>
                    </div>
                `;
                taskListEl.appendChild(el);
            });
        }

        // HTMLエスケープ (XSS対策)
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // トースト通知 (自作のアラート代替)
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('translate-y-full', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-full', 'opacity-0');
            }, 3000);
        }

        // イベントリスナーの登録
        loginBtn.addEventListener('click', handleLogin);
        logoutBtn.addEventListener('click', handleLogout);
        formTask.addEventListener('submit', addTask);
        document.getElementById('btn-save-edit').addEventListener('click', saveEditTask);
        document.getElementById('btn-confirm-delete').addEventListener('click', confirmDeleteTask);

        // グローバルスコープへの公開 (インラインonclick用)
        window.toggleTask = toggleTaskStatus;
    </script>
</head>
<body class="text-gray-800 antialiased selection:bg-blue-200">

    <!-- アプリ全体のコンテナ (モバイル向けに幅を制限して中央寄せ) -->
    <div class="max-w-md mx-auto min-h-screen bg-[#F8FAFC] relative shadow-2xl overflow-hidden flex flex-col">

        <!-- トースト通知 -->
        <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 bg-blue-600 text-white px-6 py-3 rounded-full font-bold shadow-lg transition-all duration-300 translate-y-full opacity-0 whitespace-nowrap">
            メッセージ
        </div>

        <!-- 1. ローディング画面 -->
        <div id="screen-loading" class="flex-1 flex flex-col items-center justify-center p-6">
            <svg class="animate-spin h-12 w-12 text-blue-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-blue-500 font-bold text-lg animate-pulse">準備中...</p>
        </div>

        <!-- 2. ログイン/スタート画面 -->
        <div id="screen-login" class="hidden flex-1 flex flex-col p-6 items-center justify-center bg-gradient-to-b from-blue-50 to-white">
            <div class="w-32 h-32 bg-blue-100 rounded-full flex items-center justify-center mb-8 shadow-inner">
                <span class="text-6xl">🌱</span>
            </div>
            <h1 class="text-3xl font-extrabold text-blue-600 mb-2 text-center leading-tight">
                新生活<br>サポートメモ
            </h1>
            <p class="text-gray-500 text-center font-bold mb-12">
                はじめての一人暮らし。<br>
                やること、忘れないように記録しよう。
            </p>
            
            <div class="w-full space-y-4">
                <button id="btn-login" class="btn-primary">
                    はじめる
                </button>
            </div>
        </div>

        <!-- 3. メイン画面 -->
        <div id="screen-main" class="hidden flex-1 flex flex-col h-screen">
            
            <!-- ヘッダー -->
            <header class="bg-blue-500 text-white p-6 rounded-b-[40px] shadow-md flex-shrink-0 z-10">
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-2xl font-extrabold">マイメモ📝</h1>
                    <button id="btn-logout" class="text-blue-100 font-bold text-sm bg-blue-600 px-4 py-2 rounded-full active:bg-blue-700 transition-colors">
                        終了する
                    </button>
                </div>
                <p class="text-blue-50 font-bold text-lg">
                    今日もお疲れ様です！<br>
                    自分のペースで進めましょう☕️
                </p>
            </header>

            <!-- 入力フォームエリア (スクロールに追従させず上に固定気味にする) -->
            <div class="px-5 py-4 flex-shrink-0 -mt-6 z-20">
                <form id="form-task" class="bg-white p-5 rounded-3xl shadow-lg border border-blue-100 flex flex-col gap-4">
                    <input type="text" id="input-task" required placeholder="例：トイレットペーパーを買う" 
                           class="input-large bg-blue-50/50" autocomplete="off">
                    
                    <div class="flex gap-3">
                        <div class="relative flex-1">
                            <select id="select-category" class="input-large appearance-none bg-blue-50/50 text-gray-700 font-bold">
                                <option value="shopping">🛒 お買い物</option>
                                <option value="chore">🧹 家事</option>
                                <option value="procedure">📝 手続き・支払い</option>
                                <option value="other">💡 その他</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                                <svg class="fill-current h-6 w-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                            </div>
                        </div>
                        
                        <button type="submit" class="w-20 bg-blue-500 text-white rounded-2xl font-bold shadow-md shadow-blue-500/30 active:scale-95 transition-transform flex items-center justify-center">
                            追加
                        </button>
                    </div>
                </form>
            </div>

            <!-- タスクリストエリア (スクロール領域) -->
            <div class="flex-1 overflow-y-auto px-5 pb-24 pt-2">
                
                <!-- タスクが無いときの表示 -->
                <div id="empty-state" class="hidden py-16 flex flex-col items-center justify-center text-center opacity-70">
                    <span class="text-6xl mb-4">🛋️</span>
                    <h2 class="text-xl font-bold text-gray-600 mb-2">今はやることなし！</h2>
                    <p class="text-gray-500 font-bold">
                        ゆっくり休んでくださいね。<br>
                        思いついたら追加しましょう。
                    </p>
                </div>

                <!-- タスクリスト本体 -->
                <div id="task-list">
                    <!-- JSでタスクが挿入されます -->
                </div>
            </div>
        </div>

    </div>

    <!-- 編集モーダル -->
    <div id="modal-edit" class="hidden fixed inset-0 z-50 bg-blue-900/40 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white rounded-[32px] p-6 w-full max-w-sm shadow-2xl transform transition-all">
            <h3 class="text-2xl font-extrabold text-blue-600 mb-6 text-center">メモを編集する</h3>
            
            <div class="space-y-4 mb-8">
                <input type="text" id="edit-input-task" class="input-large bg-gray-50" placeholder="内容">
                
                <div class="relative">
                    <select id="edit-select-category" class="input-large appearance-none bg-gray-50 text-gray-700 font-bold">
                        <option value="shopping">🛒 お買い物</option>
                        <option value="chore">🧹 家事</option>
                        <option value="procedure">📝 手続き・支払い</option>
                        <option value="other">💡 その他</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                        <svg class="fill-current h-6 w-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
            </div>
            
            <div class="space-y-3">
                <button id="btn-save-edit" class="btn-primary">保存する</button>
                <button onclick="window.closeEditModal()" class="btn-secondary text-gray-500 border-gray-200">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- 削除確認モーダル -->
    <div id="modal-delete" class="hidden fixed inset-0 z-50 bg-blue-900/60 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white rounded-[32px] p-8 w-full max-w-sm shadow-2xl text-center">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-3xl">🗑️</span>
            </div>
            <h3 class="text-2xl font-extrabold text-gray-800 mb-2">本当に削除しますか？</h3>
            <p class="text-gray-500 font-bold mb-8">この操作は取り消せません。</p>
            
            <div class="space-y-3">
                <button id="btn-confirm-delete" class="btn-danger">はい、削除します</button>
                <button onclick="window.closeDeleteModal()" class="btn-secondary">もどる</button>
            </div>
        </div>
    </div>

</body>
</html>
